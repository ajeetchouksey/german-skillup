name: Deploy to GitHub Pages
# Manual rollback path only — no longer auto-deploys. deploy-cloudflare-pages.yml
# is the production deployment target (hallo.aaryaai.dev — DNS points there).
# GitHub Pages was the original host but the project moved to Cloudflare Pages
# for consistency with ajch_platform's own hosting (and to share the same
# Cloudflare account/zone the auth Worker already lives in). This workflow is
# kept working (public/CNAME still present) in case a rollback is ever needed —
# trigger it from the Actions tab (workflow_dispatch) or `gh workflow run`.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Both public by design (a Worker URL and an OAuth client id, not
          # secrets — the matching client *secret* only ever lives server-side
          # as a `wrangler secret`, never here). Unset repo variables build to
          # empty strings, which keeps login correctly disabled (isAuthConfigured()
          # stays false, LoginWidget renders nothing) until both are set in
          # Settings → Secrets and variables → Actions → Variables.
          VITE_AUTH_WORKER_URL: ${{ vars.VITE_AUTH_WORKER_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
