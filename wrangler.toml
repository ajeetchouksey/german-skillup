name                = "deutsch-skillup-auth"
main                = "workers/auth.ts"
compatibility_date  = "2026-06-05"
workers_dev         = true

# ── Custom domain ─────────────────────────────────────────────────────────────
# api.hallo.aaryaai.dev, not a *.workers.dev URL — the latter leaks the
# Cloudflare account name and looks untrustworthy on a Google OAuth consent
# screen. aaryaai.dev is already a Cloudflare-managed zone on this account
# (same one hallo.aaryaai.dev's CNAME to GitHub Pages lives in), so
# custom_domain = true auto-provisions the DNS record + TLS cert for this
# api.hallo subdomain on `wrangler deploy` — no separate manual DNS step.
[[routes]]
pattern = "api.hallo.aaryaai.dev"
custom_domain = true

# ── KV namespace — per-user rate limiting on /profile/save ───────────────────
# Named DEUTSCH_SKILLUP_RATE_LIMITER (not RATE_LIMITER) deliberately — this
# Cloudflare account already has ajch_platform's own KV namespace literally
# titled "RATE_LIMITER" (id 11f07ef9b0c5432bb9a232390d3ec672); reusing it would
# share rate-limit counters across two unrelated apps.
[[kv_namespaces]]
binding = "RATE_LIMITER"
id      = "292bd8733b4647c488e2ecc6479f983b"

# ── D1 database — cross-device progress sync for Google logins ───────────────
# Schema applied via: wrangler d1 execute deutsch-skillup-progress --remote --file=workers/schema.sql
[[d1_databases]]
binding       = "DB"
database_name = "deutsch-skillup-progress"
database_id   = "387af76a-8482-48fe-ac8d-3ab4ef0fa7ff"

# ── Workers AI — powers the optional /writing/check and /reading/check ───────
# "Get AI Feedback" routes (Phase 4b, scope deliberately limited to these two
# activities for now). Two open models on Workers AI's free daily neuron
# allowance, NOT a paid provider like Anthropic — this is an open-source
# project and both routes are anonymous/user-triggered, so they must never be
# able to run up a bill on their own: llama-3.1-8b-instruct-fast writes the
# coaching reply, llama-guard-3-8b is the content-safety classifier gating it
# (see workers/auth.ts's isSafeInput — a real moderation call, not just a
# prompt instruction, since an open model has no Anthropic-style built-in
# safety layer to lean on). No API key: a binding is authenticated
# automatically by the Worker's own execution context.
#
# Three rate-limit layers (see workers/auth.ts's block comment above
# handleWritingCheck): an hourly per-IP burst cap, a 15/day cap keyed by
# logged-in identity when available (falls back to IP when anonymous — no
# login is ever required), and a 120/day GLOBAL_DAILY_AI_BUDGET shared across
# BOTH routes together, since they draw on the same account-wide free pool
# (also shared with whatever ajch_platform draws on this same account). Watch
# actual usage via `wrangler tail` (each call logs a one-line JSON record) and
# the Workers AI section of the Cloudflare dashboard (neuron consumption per
# model) before raising any of these numbers.
[ai]
binding = "AI"

# ── Secrets — set via CLI, never commit values ────────────────────────────────
# Status: KV namespace, D1 database, schema, and all three secrets are live.
#
#   wrangler secret put GOOGLE_CLIENT_ID          [x] set 2026-09-03
#     → a DEDICATED Google OAuth client (939308613423-pek1v3h8ap1ncil0e676-
#       lsciblru8kue.apps.googleusercontent.com) — not shared with
#       ajch_platform's own client after all (the original plan was to reuse
#       it, but a dedicated client turned out cleaner: zero coupling, no risk
#       of ever touching ajch_platform's live login while managing this
#       one). Its only authorized redirect URI is
#       https://api.hallo.aaryaai.dev/oauth/google/callback, set in Google
#       Cloud Console → APIs & Services → Credentials → (this client) — a
#       manual step, no API/CLI can do it.
#
#   wrangler secret put GOOGLE_CLIENT_SECRET      [x] set 2026-09-03
#     → the matching secret for the dedicated client above.
#
#   wrangler secret put SESSION_SIGNING_KEY       [x] set 2026-09-03
#     → a random 32-byte hex string, deliberately NOT shared with
#       ajch_platform's own SESSION_SIGNING_KEY, so a token minted by one
#       Worker can never be replayed against the other.
#
# No secret needed for /writing/check (Phase 4b) — it runs on the [ai]
# binding above, not a keyed API. Before it goes live: re-run `wrangler d1
# execute deutsch-skillup-progress --remote --file=workers/schema.sql` to
# create the flagged_writing_feedback table the /writing/report route needs.
#
# ── Deploy ────────────────────────────────────────────────────────────────────
# Worker is deployed: https://api.hallo.aaryaai.dev (custom domain, auto-TLS)
# and https://deutsch-skillup-auth.<account>.workers.dev (workers.dev preview,
# harmless — every route still enforces its own CORS/origin check regardless
# of hostname). Re-run `wrangler deploy` after any workers/auth.ts change;
# `wrangler secret put` takes effect immediately, no redeploy needed.
#
# Once the two Google secrets above are set, also set in the frontend build
# env (GitHub Actions repo secrets/vars, consumed by .github/workflows/deploy.yml):
#   VITE_AUTH_WORKER_URL=https://api.hallo.aaryaai.dev
#   VITE_GOOGLE_CLIENT_ID=<the same client id as GOOGLE_CLIENT_ID above>
# — client IDs are public by design (not secrets), but the matching client
# *secret* only ever belongs server-side, in this file's GOOGLE_CLIENT_SECRET.
